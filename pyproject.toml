[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-research-agent"
version = "0.4.0"
description = "Citation and claim verifier with a tamper-evident audit trail and human sign-off"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.5", "jinja2>=3.1", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=2.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]
convert = ["pypdf>=4", "python-docx>=1.1", "markdownify>=0.12", "beautifulsoup4>=4.12"]

[project.scripts]
rra = "rra.cli:main"

[tool.setuptools]
packages = ["rra"]
